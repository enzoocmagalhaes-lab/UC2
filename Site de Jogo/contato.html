<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/styleJogo.css">

    <title>Jogo em produção</title>
</head>
<body>
    <header>
        <img id="logotipo" src="media/img/OIP.webp" alt="Foto do Jogo">
        <h2> Vasculhe o antigo terreno; Descubra os segredos da mansão</h2>
    </header>

<nav>
    <ul>
        <li><a href="IndexJogo.html">Inicio</a></li>
        <li><a href="planos.html">Edições</a></li>
        <li><a href="contato.html">Lista de espera</a></li>
    </ul>
</nav>

<main>
    <section id="lista-de-espera">
        <h2>Entre na lista de espera</h2>
        <p>Seja avisado assim que Darkest Dungeon for lançado - sem spam, só o essencial</p>

        <form action="#" method="post" class="form-lista-espera">

            <div class="campo">
                <label for="nome">Nome:</label>
            
                <input 
                type="text"
                id="nome"
                name="nome"
                placeholder="Qual é o seu nome?"
                required
                >
            </div>
    
            <div class="campo">
                <label for="email">E-mail:</label>
            
                <input 
                type="email"
                id="email"
                name="email"
                placeholder="seuemail@exemplo.com"
                required
                >
            </div>
    
            <div class="campo">
                <label for="telefone">Telefone (opcional):</label>
            
                <input 
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="(21) 90000-0000"
                pattern="\(?\d{2}\)?\s?\d{5,4}\-?\d{4}"
                >
            </div>
    
            <div class="campo">
                <label for="Idade">Sua idade:</label>
            
                <input 
                type="number"
                id="idade"
                name="idade"
                min="16"
                placeholder="Qual é o sua idade?"
                required
                >
            </div>

            <button type="submit">Entrar na lista de espera</button>

            <button type="reset">Limpar Formulário</button>
        </form>
        
    </section>
</main>

<footer>
    <p>Darkest Dungeon - Todos os direitos reservados</p>
</footer>

</body>
</html>
